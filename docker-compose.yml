services:
  test:
    build:
      context: .
    command: ["ctest", "--test-dir", "build", "--output-on-failure"]

  benchmark-preview:
    build:
      context: .
    volumes:
      - ./dataset:/work/dataset:ro
      - ./report-preview:/work/report-preview
    command:
      - ./build/fast-deblur-benchmark
      - --data-dir
      - /work/dataset/image
      - --profiles
      - /work/benchmark_profiles.json
      - --out
      - /work/report-preview
      - --preview
      - --limit
      - "3"

  benchmark:
    build:
      context: .
    volumes:
      - ./dataset:/work/dataset:ro
      - ./report:/work/report
    command:
      - ./build/fast-deblur-benchmark
      - --data-dir
      - /work/dataset/image
      - --profiles
      - /work/benchmark_profiles.json
      - --out
      - /work/report

name: C++ CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose build test
      - name: Run C++ tests
        run: docker compose run --rm test
      - name: Run 3-image benchmark smoke report
        run: docker compose run --rm benchmark-preview
      - name: Upload HTML benchmark smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-deblur-preview-report
          path: report-preview/
          if-no-files-found: warn
